<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CadWebView 样例页</title>
  <style>
    body { margin: 0; padding: 20px; font-family: "Segoe UI", "Microsoft YaHei", sans-serif; color: #222; }
    h1 { font-size: 20px; margin: 0 0 8px; }
    p { font-size: 13px; line-height: 1.7; color: #555; }
    table { border-collapse: collapse; font-size: 13px; margin-top: 12px; width: 100%; }
    th, td { border: 1px solid #ddd; padding: 6px 10px; text-align: left; }
    th { background: #f5f5f5; }
  </style>
</head>
<body>
  <h1>CadWebView 样例页</h1>
  <p>这是内置的离线冒烟页面，用于验证面板 / 无模式窗口两种形态能否正常渲染。</p>
  <table>
    <tr><th>命令</th><th>行为</th></tr>
    <tr><td>CADWEBVIEW</td><td>打开可停靠面板（单例）</td></tr>
    <tr><td>CADWEBVIEW → W</td><td>打开无模式窗口（单例）</td></tr>
    <tr><td>CADWEBVIEW → URL</td><td>用输入的地址打开面板</td></tr>
  </table>
</body>
</html>
